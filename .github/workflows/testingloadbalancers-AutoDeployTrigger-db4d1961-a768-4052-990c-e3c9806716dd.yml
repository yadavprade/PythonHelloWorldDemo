name: Trigger auto deployment for testingloadbalancers

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/testingloadbalancers-AutoDeployTrigger-db4d1961-a768-4052-990c-e3c9806716dd.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.TESTINGLOADBALANCERS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TESTINGLOADBALANCERS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TESTINGLOADBALANCERS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: nodecontainerregistry.azurecr.io
          registryUsername: ${{ secrets.TESTINGLOADBALANCERS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TESTINGLOADBALANCERS_REGISTRY_PASSWORD }}
          containerAppName: testingloadbalancers
          resourceGroup: TestLoad
          imageToBuild: nodecontainerregistry.azurecr.io/testingloadbalancers:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


